
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venue Management Portal</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../shared/theme.css">

</head>
<body>

    <header>
        <h1>Venue Management Portal</h1>
        <p>Event Ticketing and Venue Booking System</p>
    </header>

    <main>
        <section class="dashboard">
            <h2>Venue Dashboard</h2>
            <p>Manage event venues, locations, and capacities.</p>

            <button id="addVenueBtn" type="button">
                + Add New Venue
            </button>
        </section>

        <section class="venue-section">
            <h2>Venue List</h2>

            <table>
                <thead>
                    <tr>
                        <th>Venue ID</th>
                        <th>Venue Name</th>
                        <th>Location</th>
                        <th>Capacity</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="venueTableBody">
                    <tr>
                        <td colspan="6">Loading venues...</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <section id="venueFormSection" hidden>
        <h2 id="formTitle">Add New Venue</h2>

        <form id="venueForm">
            <input type="hidden" id="venueId">

            <label for="venueName">Venue Name</label>
            <input type="text" id="venueName" required>

            <label for="venueAddress">Address</label>
            <input type="text" id="venueAddress" required>

            <label for="venueCity">City</label>
            <input type="text" id="venueCity" required>

            <label for="venueState">State</label>
            <input type="text" id="venueState" required>

            <label for="venueCapacity">Capacity</label>
            <input type="number" id="venueCapacity" min="1" required>

            <label for="venueFacilities">Facilities</label>
            <textarea id="venueFacilities"></textarea>

            <label for="venueStatus">Status</label>
            <select id="venueStatus">
                <option value="available">Available</option>
                <option value="unavailable">Unavailable</option>
            </select>

            <button type="submit">Save Venue</button>
            <button type="button" id="cancelBtn">Cancel</button>
        </form>
    </section>

    <script src="script.js"></script>

    <script src="../shared/navigation.js"></script>
</body>
</html>
